# Android build for LMMS - UNTESTED first draft. Run manually from the Actions tab.
name: Android (experimental)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }

      # Qt 5.15 officially pairs with NDK r21e
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r21e }

      - name: Install Qt 5.15 for Android
        run: |
          pip install aqtinstall
          aqt install-qt linux android 5.15.2 android -O "$HOME/Qt"
          aqt install-qt linux desktop 5.15.2 gcc_64 -O "$HOME/Qt"

      - name: Cross-compile native dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
          ANDROID_NDK="${{ steps.ndk.outputs.ndk-path }}" \
            bash android/build-deps.sh "$HOME/android-deps"

      - name: Configure LMMS
        run: |
          export PKG_CONFIG_LIBDIR="$HOME/android-deps/lib/pkgconfig"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/5.15.2/android;$HOME/android-deps" \
            -Doboe_DIR="$HOME/android-deps/lib/cmake/oboe" \
            -DWANT_QT5=ON -DWANT_OBOE=ON \
            -DLMMS_MINIMAL=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lmms-android-build, path: build }
